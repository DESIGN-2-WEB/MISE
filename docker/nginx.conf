# Serves the prerendered site the way a static host does:
# /about -> /about/index.html, unknown addresses -> 404.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Browsers must re-check the service worker so each release is picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
