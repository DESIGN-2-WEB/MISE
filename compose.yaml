services:
  web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8088}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-hello@example.com}
        VITE_MEALDB_API_KEY: ${VITE_MEALDB_API_KEY:-1}
    image: mise-web
    container_name: mise-web
    ports:
      - "8088:80"
    restart: unless-stopped
